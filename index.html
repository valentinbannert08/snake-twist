<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake mit Twist</title>
<style>
  :root {
    --bg: #12151c;
    --panel: #1b202b;
    --line: #2a3142;
    --text: #e8ecf4;
    --muted: #8b95aa;
    --snake: #5fd38d;
    --head: #b6f5cf;
    --food: #ff6b6b;
    --block: #6b7690;
    --accent: #ffd166;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  .bar {
    width: min(480px, 100%);
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .bar b { color: var(--text); }
  .rule {
    width: min(480px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--accent);
    border-radius: 8px;
    padding: 10px 14px;
  }
  .rule .name { font-weight: 700; color: var(--accent); }
  .rule .desc { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .rule.flash { animation: flash 0.5s ease-out; }
  @keyframes flash {
    from { background: #4a4020; }
    to { background: var(--panel); }
  }
  canvas {
    width: min(480px, 100%);
    aspect-ratio: 1;
    background: var(--panel);
    border-radius: 8px;
    touch-action: none;
  }
  .help { color: var(--muted); font-size: 13px; text-align: center; }
  kbd {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: inherit;
  }
</style>
</head>
<body>
  <h1>Snake mit Twist</h1>
  <div class="bar">
    <span>Punkte: <b id="score">0</b></span>
    <span>Rekord: <b id="best">0</b></span>
  </div>
  <div class="rule" id="rule">
    <div class="name" id="ruleName"></div>
    <div class="desc" id="ruleDesc"></div>
  </div>
  <canvas id="board" width="480" height="480"></canvas>
  <div class="help">
    <kbd>Pfeiltasten</kbd> oder <kbd>WASD</kbd> steuern · <kbd>Leertaste</kbd> Start/Neustart · <kbd>P</kbd> Pause
  </div>

<script>
const N = 24;
const CELL = 20;
const BASE_DELAY = 115;

const RULES = [
  { id: 'normal',  name: 'Normal',          desc: 'Keine Besonderheiten. Durchatmen.' },
  { id: 'turbo',   name: 'Turbo',           desc: 'Die Schlange ist deutlich schneller.' },
  { id: 'slow',    name: 'Zeitlupe',        desc: 'Alles läuft gemächlich.' },
  { id: 'mirror',  name: 'Spiegelsteuerung', desc: 'Links ist rechts, oben ist unten.' },
  { id: 'wrap',    name: 'Offene Wände',    desc: 'Am Rand kommst du gegenüber wieder heraus.' },
  { id: 'ghost',   name: 'Geisterschwanz',  desc: 'Du kannst durch deinen eigenen Körper gleiten.' },
  { id: 'double',  name: 'Doppelt',         desc: 'Das nächste Futter zählt und verlängert doppelt.' },
  { id: 'blocks',  name: 'Mauerbau',        desc: 'Drei neue Hindernisse sind erschienen. Sie bleiben.' },
];

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const css = getComputedStyle(document.documentElement);
const color = name => css.getPropertyValue(name).trim();

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const ruleEl = document.getElementById('rule');
const ruleNameEl = document.getElementById('ruleName');
const ruleDescEl = document.getElementById('ruleDesc');

let snake, dir, queue, food, rule, obstacles, score, grow, timer;
let state = 'ready'; // ready | playing | paused | over
let best = 0;
try { best = Number(localStorage.getItem('snake-twist-best')) || 0; } catch (e) {}
bestEl.textContent = best;

function reset() {
  snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
  dir = { x: 1, y: 0 };
  queue = [];
  obstacles = [];
  score = 0;
  grow = 0;
  setRule(RULES[0], false);
  placeFood();
  scoreEl.textContent = score;
}

function same(a, b) { return a.x === b.x && a.y === b.y; }

function isFree(c) {
  return !snake.some(s => same(s, c)) &&
         !obstacles.some(o => same(o, c)) &&
         !(food && same(food, c));
}

function randomFreeCell(minDistFromHead = 0) {
  for (let i = 0; i < 500; i++) {
    const c = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    const dist = Math.abs(c.x - snake[0].x) + Math.abs(c.y - snake[0].y);
    if (dist >= minDistFromHead && isFree(c)) return c;
  }
  return null;
}

function placeFood() {
  food = null;
  food = randomFreeCell(2);
}

function setRule(r, flash = true) {
  rule = r;
  ruleNameEl.textContent = 'Regel: ' + r.name;
  ruleDescEl.textContent = r.desc;
  if (flash) {
    ruleEl.classList.remove('flash');
    void ruleEl.offsetWidth; // Animation neu starten
    ruleEl.classList.add('flash');
  }
}

function nextRule() {
  const options = RULES.filter(r => r.id !== rule.id && r.id !== 'normal');
  const r = options[Math.floor(Math.random() * options.length)];
  setRule(r);
  if (r.id === 'blocks') {
    for (let i = 0; i < 3; i++) {
      const c = randomFreeCell(5);
      if (c) obstacles.push(c);
    }
  }
}

function delay() {
  if (rule.id === 'turbo') return 70;
  if (rule.id === 'slow') return 190;
  return BASE_DELAY;
}

function step() {
  while (queue.length) {
    const d = queue.shift();
    if (d.x !== -dir.x || d.y !== -dir.y) { dir = d; break; }
  }

  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  if (rule.id === 'wrap') {
    head.x = (head.x + N) % N;
    head.y = (head.y + N) % N;
  } else if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N) {
    return gameOver();
  }

  if (obstacles.some(o => same(o, head))) return gameOver();

  // Das Schwanzende rückt in diesem Schritt weg, sofern nicht gewachsen wird
  const body = grow > 0 ? snake : snake.slice(0, -1);
  if (rule.id !== 'ghost' && body.some(s => same(s, head))) return gameOver();

  snake.unshift(head);

  if (same(head, food)) {
    const amount = rule.id === 'double' ? 2 : 1;
    score += amount;
    grow += amount;
    scoreEl.textContent = score;
    nextRule();
    placeFood();
  }

  if (grow > 0) grow--; else snake.pop();

  draw();
  timer = setTimeout(step, delay());
}

function start() {
  reset();
  state = 'playing';
  draw();
  timer = setTimeout(step, delay());
}

function togglePause() {
  if (state === 'playing') {
    state = 'paused';
    clearTimeout(timer);
    draw();
  } else if (state === 'paused') {
    state = 'playing';
    timer = setTimeout(step, delay());
  }
}

function gameOver() {
  state = 'over';
  clearTimeout(timer);
  if (score > best) {
    best = score;
    bestEl.textContent = best;
    try { localStorage.setItem('snake-twist-best', String(best)); } catch (e) {}
  }
  draw();
}

function steer(x, y) {
  if (state !== 'playing') return;
  if (rule.id === 'mirror') { x = -x; y = -y; }
  const last = queue.length ? queue[queue.length - 1] : dir;
  if (last.x === x && last.y === y) return;
  if (last.x === -x && last.y === -y) return;
  if (queue.length < 2) queue.push({ x, y });
}

function rect(c, fill, inset = 1) {
  ctx.fillStyle = fill;
  ctx.fillRect(c.x * CELL + inset, c.y * CELL + inset, CELL - inset * 2, CELL - inset * 2);
}

function overlay(title, sub) {
  ctx.fillStyle = 'rgba(18, 21, 28, 0.78)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = color('--text');
  ctx.font = '700 28px -apple-system, sans-serif';
  ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 8);
  ctx.fillStyle = color('--muted');
  ctx.font = '15px -apple-system, sans-serif';
  ctx.fillText(sub, canvas.width / 2, canvas.height / 2 + 22);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Rand zeigt, ob die Wände offen sind
  ctx.strokeStyle = rule.id === 'wrap' ? color('--accent') : color('--line');
  ctx.lineWidth = 4;
  ctx.setLineDash(rule.id === 'wrap' ? [10, 8] : []);
  ctx.strokeRect(0, 0, canvas.width, canvas.height);
  ctx.setLineDash([]);

  obstacles.forEach(o => rect(o, color('--block')));

  if (food) {
    ctx.fillStyle = rule.id === 'double' ? color('--accent') : color('--food');
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = rule.id === 'ghost' ? 0.45 : 1;
  for (let i = snake.length - 1; i > 0; i--) rect(snake[i], color('--snake'));
  ctx.globalAlpha = 1;
  rect(snake[0], color('--head'));

  if (state === 'ready') overlay('Snake mit Twist', 'Leertaste drücken oder tippen zum Starten');
  if (state === 'paused') overlay('Pause', 'P drücken zum Fortsetzen');
  if (state === 'over') overlay('Game Over · ' + score + ' Punkte', 'Leertaste drücken oder tippen für eine neue Runde');
}

const KEYS = {
  ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0],
  w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0],
};

document.addEventListener('keydown', e => {
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === ' ') {
    e.preventDefault();
    if (state === 'ready' || state === 'over') start();
    else togglePause();
  } else if (key === 'p') {
    togglePause();
  } else if (KEYS[key]) {
    e.preventDefault();
    steer(...KEYS[key]);
  }
});

// Wischgesten für Touch-Geräte
let touchStart = null;
canvas.addEventListener('pointerdown', e => {
  touchStart = { x: e.clientX, y: e.clientY };
});
canvas.addEventListener('pointerup', e => {
  if (!touchStart) return;
  const dx = e.clientX - touchStart.x;
  const dy = e.clientY - touchStart.y;
  touchStart = null;
  if (Math.abs(dx) < 15 && Math.abs(dy) < 15) {
    if (state === 'ready' || state === 'over') start();
    return;
  }
  if (Math.abs(dx) > Math.abs(dy)) steer(Math.sign(dx), 0);
  else steer(0, Math.sign(dy));
});

reset();
draw();
</script>
</body>
</html>
